apiVersion: v1
kind: Service
metadata:
  name: argocd-frontend-external
  namespace: argocd
  annotations:
    external-dns.alpha.kubernetes.io/hostname: argocd.ntsme.org
    argocd.argoproj.io/sync-wave: "2"
spec:
  type: LoadBalancer
  ports:
    - name: https
      port: 443
      targetPort: 8080
      protocol: TCP
  selector:
    app.kubernetes.io/name: argocd-server
