apiVersion: v1
kind: Service
metadata:
  name: argocd-frontend-external
  namespace: argocd
  annotations:
    external-dns.alpha.kubernetes.io/hostname: argocd.ntsme.org
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app.kubernetes.io/name: argocd-server
