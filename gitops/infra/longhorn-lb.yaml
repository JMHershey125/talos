apiVersion: v1
kind: Service
metadata:
  name: longhorn-frontend-external
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    external-dns.alpha.kubernetes.io/hostname: longhorn.ntsme.org
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app: longhorn-ui
